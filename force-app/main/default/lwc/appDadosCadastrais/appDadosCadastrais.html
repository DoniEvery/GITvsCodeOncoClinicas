<template>
    <div class="container">

        <!-- Cabeçalho -->
        <div class="header">
            <img src={fotoPaciente} alt="Foto paciente" class="avatar" />
            <div class="dados-paciente">
                <p class="nome">{nomePaciente}</p>
                <p class="info">Data nasc.: {dataNascimento}</p>
                <p class="info">CPF: {cpf}</p>
            </div>
        </div>

        <!-- Descrição -->
        <div class="descricao-container">
            <p class="descricao">
                Por favor preencha seus dados para continuar o processo de check-in.
            </p>
        </div>

        <!-- Dados pessoais -->
        <div class="section">
            <div class="section-header">
                <img src={iconeDados} alt="Ícone dados" class="icone" />
                <span>Dados pessoais</span>
            </div>
            <hr>

            <div class="form-grid">
                <lightning-combobox name="nacionalidade" label="Nacionalidade" options={opcoesNacionalidade} value={nacionalidade} onchange={handleInputChange} required></lightning-combobox>
                <lightning-combobox name="estadoCivil" label="Estado civil" options={opcoesEstadoCivil} value={estadoCivil} onchange={handleInputChange} required></lightning-combobox>
                <lightning-combobox name="sexo" label="Sexo" options={opcoesSexo} value={sexo} onchange={handleInputChange} required></lightning-combobox>
                <lightning-combobox name="grauInstrucao" label="Grau de instrução" options={opcoesGrauInstrucao} value={grauInstrucao} onchange={handleInputChange} required></lightning-combobox>
                <lightning-input name="celular" label="Celular" type="tel" value={celular} onchange={handleInputChange} required></lightning-input>
                <lightning-combobox name="profissao" label="Profissão/Ocupação" options={opcoesProfissao} value={profissao} onchange={handleInputChange} required></lightning-combobox>
                <lightning-combobox name="religiao" label="Religião" options={opcoesReligiao} value={religiao} onchange={handleInputChange} required></lightning-combobox>
                <div class="label-com-ajuda">
                    <span>Deseja utilizar seu nome social?</span>
                    <lightning-helptext content="É o nome que você escolhe usar no dia a dia e pelo qual deseja ser chamado(a), mesmo que seja diferente do seu nome registrado."></lightning-helptext>
                    <lightning-radio-group name="usaNomeSocial" options={opcoesNomeSocial} value={usaNomeSocial} type="radio" onchange={handleNomeSocialChange}></lightning-radio-group>
                </div>
                <template if:true={mostrarCampoNomeSocial}>
                    <lightning-input name="nomeSocial" label="Nome social" value={nomeSocial} onchange={handleInputChange} required></lightning-input>
                </template>
            </div>
        </div>

        <!-- Filiação -->
        <div class="section">
            <div class="section-header">
                <img src={iconeFiliacao} alt="Ícone filiação" class="icone" />
                <span>Filiação</span>
            </div>
            <hr>
            <div class="form-grid">
                <lightning-input name="nomeMae" label="Nome mãe" value={nomeMae} onchange={handleInputChange} required></lightning-input>
                <lightning-input name="nomePai" label="Nome pai" value={nomePai} onchange={handleInputChange} required></lightning-input>
            </div>
        </div>

        <!-- Botões -->
        <div class="footer">
            <lightning-button label="Voltar" variant="neutral" onclick={handleVoltar}></lightning-button>
            <button class="btn-continuar" onclick={handleContinuar} disabled={isFormInvalid}>
                Continuar
            </button>
        </div>

    </div>
</template>
