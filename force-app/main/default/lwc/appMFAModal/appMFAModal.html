<template>
    <template if:true={isOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">Validação MFA</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input
                        label="Digite o código recebido"
                        value={token}
                        onchange={handleChange}
                        type="text"
                        maxlength="6"
                        required>
                    </lightning-input>
                    <template if:true={errorMessage}>
                        <div class="slds-text-color_error slds-m-top_small">{errorMessage}</div>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancelar" onclick={handleCancel}></lightning-button>
                    <lightning-button variant="brand" label="Confirmar" onclick={handleConfirm} class="slds-m-left_small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
