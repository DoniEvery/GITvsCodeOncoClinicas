    <div class="chat-messages-container" style="overflow-y:auto; height: 400px;">
        <template if:true={showLoadMore}>
            <div class="load-more" onclick={handleLoadMore}>

            </div>
        </template>

        <template for:each={messages} for:item="message">
            <c-app-chat-message-item
                key={message.messageId}
                message={message}

        </template>
    </div>
