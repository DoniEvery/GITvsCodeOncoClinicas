<template>
    <div class={hostClass}>

        <!-- Mostrar layout completo apenas se NÃO estiver mostrando termo -->
        <template if:false={mostrarTermo}>
            <div class="layout-container">
                <div class="main-wrapper">
                    <template if:false={isProfilePage}>
                        <div class="header-image-container">
                            <img src={headerImage} alt="Header Image" class="header-image"/>
                        </div>
                    </template>

                    <div class="content-container">
                        <template if:false={isMobile}>
                            <div class="sidebar-container">
                                <c-app-sidebar onmenuselected={handleMenuSelection}></c-app-sidebar>
                            </div>
                        </template>

                        <template if:true={isMobile}>
                            <div class={sidebarMobileContainerClass}>
                                <c-app-sidebar 
                                    onmenuselected={handleMenuSelection}
                                    onclose={handleCloseSidebar}>
                                </c-app-sidebar>
                            </div>
                        </template>

                        <div class="right-container">
                            <template if:true={showHeader}>
                                <div class="header-container">
                                    <c-app-header page-name={currentPage} from-page={previousPage} onnavigate={handleNavigate}></c-app-header>
                                </div>
                            </template>                    
                            <template if:false={isProfilePage} class={mainContainerClass}>
                                <div class="main-container" >
                                    <c-app-main-content 
                                        current-page={currentPage}
                                        onnavigate={handleNavigate}
                                        onabrirconfirmmodal={abrirConfirmModal}
                                        onabrirdetalhesmodal={abrirDetalhesModal}
                                        onabrirdatemodal={abrirDateFilterModal}
                                        onfecharmodais={fecharTodosModais}>
                                    </c-app-main-content>
                                </div>                        
                            </template>                      
                        </div>
                    </div>
                </div>

                <template if:true={isMobile}>
                    <div class="tabbar-container">
                        <c-app-tab-bar
                            active-tab={currentPage}
                            ontabchange={handleTabChange}
                            onopensidebar={handleOpenSidebar}>
                        </c-app-tab-bar>
                    </div>
                </template>
            </div>

            <!-- MODAIS GLOBAIS -->
            <template if:true={showConfirmModal}>
                <section class="modal-backdrop">
                    <c-app-confirm-modal
                        titulo="Confirmação do agendamento"
                        texto="Deseja confirmar este agendamento?"
                        imagem={detalhesConsulta} 
                        exibir-modal={showConfirmModal}
                        oncancel={fecharTodosModais}
                        onconfirm={confirmarConsulta}>
                    </c-app-confirm-modal>
                </section>
            </template>

            <template if:true={showDetalhesModal}>
                <section class="modal-backdrop">
                    <c-app-schedule-details 
                        consulta={selectedConsulta} 
                        onfechar={fecharTodosModais}
                        onconfirmar={abrirConfirmModal}>
                    </c-app-schedule-details>
                </section>
            </template>

            <template if:true={showDateFilterModal}>
                <section class="modal-backdrop">
                    <c-app-date-modal
                        onfechar={fecharTodosModais}
                        onconfirmar={aplicarFiltroDatas}>
                    </c-app-date-modal>
                </section>
            </template>    
        </template>

        <!-- Mostrar componente do termo se precisar aceitar -->
        <template if:true={mostrarTermo}>
            <c-app-termo-uso-page onaceito={handleTermoAceito}></c-app-termo-uso-page>
        </template>
    </div>
</template>
