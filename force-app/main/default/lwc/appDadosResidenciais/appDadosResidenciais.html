<template>
    <div class="container">

        <!-- Cabeçalho -->
        <div class="header">
            <img src={fotoPaciente} alt="Foto paciente" class="avatar" />
            <div class="dados-paciente">
                <p class="nome">{nomePaciente}</p>
                <p class="info">Data nasc.: {dataNascimento}</p>
                <p class="info">CPF: {cpf}</p>
            </div>
        </div>

        <!-- Descrição -->
        <div class="descricao-container">
            <p class="descricao">
                Por favor preencha seus dados para continuar o processo de check-in.
            </p>
        </div>

        <!-- Dados residenciais -->
        <div class="section">
            <div class="section-header">
                <img src={iconeDados} alt="Ícone dados" class="icone" />
                <span>Dados residenciais</span>
            </div>
            <hr>

            <div class="form-grid">

                <lightning-input name="CEP" label="CEP" value={cep} onchange={handleCepInput} placeholder="Digite o CEP" required></lightning-input>
                <lightning-input name="Endereço" label="Endereço" value={endereco} onchange={handleInputChange} placeholder="Endereço" required></lightning-input>
                <lightning-input name="Número" label="Número" value={numero} onchange={handleInputChange} placeholder="Digite seu número" required></lightning-input>
                <lightning-input name="Complemento" label="Complemento" value={complemento} onchange={handleInputChange} placeholder="Digite o complemento" required></lightning-input>
                <lightning-input name="Bairro" label="Bairro" value={bairro} onchange={handleInputChange} placeholder="Bairro" required></lightning-input>
                <lightning-input name="Municipio" label="Municipio" value={municipio} onchange={handleInputChange} placeholder="Municipio" required></lightning-input>
                <lightning-input name="Estado" label="Estado" value={estado} onchange={handleInputChange} placeholder="Estado" required></lightning-input>
                <lightning-input name="País" label="País" value={pais} onchange={handleInputChange} placeholder="País" required></lightning-input>
                <lightning-input name="Email" label="Email" type="email" value={email} onchange={handleInputChange} placeholder="Digite seu e-mail" required></lightning-input>
                <lightning-input name="TelefoneAdd" label="Telefone Adicional" type="tel" value={telefoneAdicional} oninput={handleTelefoneInput} placeholder="(11) 91234-5678"></lightning-input>
            
            </div>
        </div>

        <!-- Botões -->
        <div class="footer">
            <lightning-button label="Voltar" variant="neutral" onclick={handleVoltar}></lightning-button>
            <button class="btn-continuar" onclick={continuar} disabled={isFormInvalid}>
                Continuar
            </button>
        </div>
    </div>
</template>
