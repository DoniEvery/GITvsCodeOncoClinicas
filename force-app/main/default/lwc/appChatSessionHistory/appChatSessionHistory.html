<template>
    <lightning-card title="Histórico de Sessões">
        <template if:true={sessions}>
            <ul class="slds-list_dotted">
                <template for:each={sessions} for:item="session">
                    <li key={session.Id}>
                        <a href="javascript:void(0);" onclick={handleSessionClick} data-id={session.Id}>
                            {session.otherUserName} - {session.statusLabel}
                        </a>
                    </li>
                </template>
            </ul>
        </template>
        <template if:false={sessions}>
            <p class="slds-p-around_small">Nenhuma sessão encontrada.</p>
        </template>
    </lightning-card>
</template>
