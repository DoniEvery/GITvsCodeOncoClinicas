<template>
    <article class="slds-card slds-card_boundary">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <span class="slds-icon_container slds-icon-custom-94">
                        <svg class="slds-icon slds-icon_small" aria-hidden="true">
                            <use xlink:href="/_slds/icons/custom-sprite/svg/symbols.svg#custom94"></use>
                        </svg>
                        <span class="slds-assistive-text">Encontros</span>
                    </span>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <a href="#" class="slds-card__header-link slds-truncate" title="Encontros">
                            <template if:false={hasTooManyRows}>
                                <span>1ª Interações ({records.length})</span>
                            </template>
                            <template if:true={hasTooManyRows}>
                                <span>1ª Interações ({records.length}+)</span>
                            </template>
                        </a>
                    </h2>
                </div>
                <!-- <div class="slds-no-flex">
                    <button class="slds-button slds-button_neutral" onclick={handleNovoEncontro}>Novo</button>
                </div> -->
            </header>
        </div>
        <template if:true={records}>
            <template if:true={hasTooManyRowsHeight}>
                <div class="table-container" style="height:350px;">
                    <lightning-datatable 
                        show-row-number-column 
                        key-field="Id" 
                        data={tableData} 
                        columns={columns}
                        hide-checkbox-column 
                        style="width: 100%;" 
                        onrowaction={handleRowAction}>
                    </lightning-datatable>

                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </template>
                </div>
            </template>
            <template if:false={hasTooManyRowsHeight}>
                <div class="table-container" style="height:auto;">
                    <lightning-datatable 
                        show-row-number-column 
                        key-field="Id" 
                        data={tableData} 
                        columns={columns}
                        hide-checkbox-column 
                        style="width: 100%;" 
                        onrowaction={handleRowAction}>
                    </lightning-datatable>

                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </template>
                </div>
            </template>
        </template>
        <footer class="slds-align_absolute-center" style="height:2rem; margin-bottom:5px;">
            <!-- <a class="slds-card__footer-action" onclick={navigateToContactRelatedList} href="#">Exibir tudo
            </a> -->
        </footer>
    </article>
</template>
