                            aria-hidden="true">
                            <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#switch"></use>
                        </svg>

                                        <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#warning"></use>
                                    </svg>
                                </span>

                                </div>
                            </div>
