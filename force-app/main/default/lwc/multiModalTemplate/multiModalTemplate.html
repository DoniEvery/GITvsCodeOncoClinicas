<template>
    <template if:false={isCard}>
        <!--<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-fade-in-open modal-position">-->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class={modalClasses}>
                <!-- Header of Modal -->
                <template if:true={getTitle}>
                    <header class="slds-modal__header" style="color: rgb(0, 0, 0) !important;">
                    
                            <div style="display: flex">
                                <div class="slds-media__body">
                                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">
                                        {title}
                                    </h2>
                                </div>
                                <slot name="actions">  </slot>
                            </div>
                    
                        
                        <button class="slds-button slds-button_icon slds-button_icon-inverse slds-modal__close"
                            title="Close" onclick={doClose}>
                            <svg class="slds-button__icon" aria-hidden="true">
                                <use xlink:href="/_slds/icons/utility-sprite/svg/symbols.svg#close"></use>
                            </svg>
                        </button>
                    </header>
                </template>

                <!-- Body of Modal -->
                <template if:false={notHasBody}>
                    <div class={bodyModalClasses} id="modal-content-id-1" style="overflow: initial;">
                        <slot name="body">

                        </slot>
                    </div>
                </template>

                <!-- Footer of Modal -->
                <footer class="slds-modal__footer">
                    <slot name="footer">

                    </slot>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open fade"></div>
    </template>
</template>
