<template>
    <div class="user-profile-form slds-box slds-theme_default slds-p-around_medium">
        <template if:false={isReady}>
            <div class="slds-is-relative" style="min-height: 200px;">
                <lightning-spinner alternative-text="Carregando perfil..." size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={isReady}>
            <div class="profile-container slds-grid slds-gutters">
                <div class="user-details-section slds-col slds-size_3-of-4">
                    <template if:false={isEditing}>
                        <div class="user-name slds-text-heading_medium">{name}</div>
                        <div class="user-info-field">Email: {email}</div>
                        <div class="user-info-field">Telefone: {phone}</div>
                        <div class="user-info-field">Celular: {mobilePhone}</div>
                        <lightning-button label="Editar" variant="brand" onclick={handleEditClick}></lightning-button>
                    </template>

                    <template if:true={isEditing}>
                        <div class="slds-is-relative">
                            <template if:true={isLoading}>
                                <lightning-spinner alternative-text="Salvando..." size="small"></lightning-spinner>
                            </template>

                            <div class="fade-in slds-p-top_medium">
                                <div class="slds-grid slds-wrap slds-gutters">
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Nome" name="FirstName" value={firstName} onchange={handleInputChange} required></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Sobrenome" name="LastName" value={lastName} onchange={handleInputChange} required></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1">
                                        <lightning-input
                                            label="E-mail"
                                            name="Email"
                                            value={email}
                                            onchange={handleInputChange}
                                            type="email"
                                            placeholder="seu.email@exemplo.com"
                                            required={emailEhObrigatorio}>
                                        </lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Telefone" name="Phone" value={phone} onchange={handleInputChange} placeholder="(11) 3333-4444"></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Celular" name="MobilePhone" value={mobilePhone} onchange={handleInputChange} required placeholder="(11) 95555-5555"></lightning-input>
                                    </div>
                                    <div class="button-container slds-m-top_medium">
                                        <lightning-button label="Cancelar" variant="base" onclick={handleCancel}></lightning-button>
                                        <lightning-button label="Salvar" variant="brand" onclick={handleSave}></lightning-button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</template>
