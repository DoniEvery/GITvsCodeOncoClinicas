<template>
    <div class="slds-grid slds-p-around_small">
        <lightning-input
            class="slds-col slds-size_10-of-12"
            label="Mensagem"
            value={newMessage}
            onchange={handleInputChange}
            onkeydown={handleKeydown}
            variant="label-hidden"
            placeholder="Digite sua mensagem...">
        </lightning-input>

        <lightning-button
            class="slds-col slds-size_2-of-12"
            label="Enviar"
            disabled={disabled}
            onclick={handleSend}>
        </lightning-button>
    </div>
</template>
